<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vignette gallery (dev)</title>
    <style>
      body { margin: 0; padding: 16px; background: #f7f1e1; color: #2b2620; font: 12px/1.3 system-ui, sans-serif; }
      h2 { font: 600 13px Georgia, serif; margin: 14px 0 6px; letter-spacing: 0.04em; }
      .row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: nowrap; }
      .card { border: 1px solid #2b2620; border-radius: 3px; overflow: hidden; background: #efe4c8; flex: none; }
      .big { width: 300px; height: 188px; }
      .small { width: 168px; height: 105px; }
      .grey .card { filter: grayscale(1); }
      .grid { display: grid; grid-template-columns: repeat(7, 168px); gap: 8px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./vignettes-dev.tsx"></script>
  </body>
</html>
