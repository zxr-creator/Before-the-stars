[workspace]
resolver = "2"
members = ["crates/bts-protocol", "crates/bts-engine", "crates/bts-ai", "crates/bts-server"]

[workspace.package]
version = "0.2.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
