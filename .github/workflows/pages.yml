# Publishes the browser game to GitHub Pages.
#
# The site is a static build with no server behind it: the Rust rules engine is
# compiled to WebAssembly and runs in a Web Worker in the player's browser
# (docs/web-build.md). Everything is built from source here; nothing built is
# kept in the repository.
#
#   - runs on every push to main, or by hand from the Actions tab
#   - needs Pages to be enabled for the repository with "GitHub Actions" as its source
#   - the site is served under /<repository>/; every URL in the build is relative, and
#     the browser check below loads it from exactly that path before it is published
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_browser_check:
        description: Publish without the headless browser check
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the one in progress rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pages-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: pages-cargo-${{ runner.os }}-
      - name: Rust tests
        # The desktop window of bts-server needs a system web view; on Linux the referee is
        # tested headless. The shared host and the WebAssembly ABI are tested natively.
        run: |
          cargo test --release --workspace --exclude bts-server
          cargo test --release -p bts-server --no-default-features
      - name: Web client packages
        working-directory: apps/web
        run: npm ci --no-fund --no-audit
      - name: Build the browser game
        run: scripts/build-pages.sh dist/pages
      - name: Check it in a browser, served from the repository path
        if: ${{ !inputs.skip_browser_check }}
        env:
          SITE_PATH: /${{ github.event.repository.name }}/
        run: |
          (cd apps/web && npx playwright install --with-deps chromium)
          node apps/web/scripts/serve-static.mjs dist/pages 8080 "$SITE_PATH" &
          sleep 1
          node apps/web/scripts/pages-smoke.mjs "http://127.0.0.1:8080$SITE_PATH"
      - name: Keep the screenshots when the browser check fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: pages-smoke-screenshots
          path: apps/web/screenshots/pages
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
