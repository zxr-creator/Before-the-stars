[package]
name = "bts-ai"
description = "Native non-LLM opponents. Depends only on the public protocol: it sees observations and emits actions."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bts-protocol = { path = "../bts-protocol" }
serde.workspace = true
# the public content tables compiled in (src/tables.rs)
serde_json.workspace = true

[dev-dependencies]
# the referee, to drive all-native matches under audit (tests/conservation.rs); the
# policy itself still sees only bts-protocol observations
bts-engine = { path = "../bts-engine" }
